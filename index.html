<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=presentation_layer/html/dashboard.html" />
  <title>Redirecting to X-Sload Dashboard...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      margin: 8px 0;
    }
    a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #a5b4fc;
      text-decoration: underline;
    }
  </style>
  <script>
    // Immediate JavaScript redirection
    window.location.replace("presentation_layer/html/dashboard.html");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecting to X-Sload Dashboard...</h2>
  <p>If you are not redirected automatically, <a href="presentation_layer/html/dashboard.html">click here to proceed</a>.</p>
</body>
</html>
